# apiVersion : un Service fait partie du groupe "core", donc "v1".
apiVersion: v1

# kind : donne une adresse stable aux pods du frontend et les expose
# à l'extérieur du cluster.
kind: Service

metadata:
  # name : nom imposé par l'énoncé.
  name: frontend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: frontend

spec:
  # type : NodePort = ouvre un port sur le nœud (ici 30080) en plus de l'IP
  # interne du cluster. C'est ce qui permet d'ouvrir le site dans le navigateur.
  type: NodePort

  # selector : labels des PODS du Deployment frontend
  # (identiques à spec.template.metadata.labels).
  selector:
    app: bijouterie
    tier: frontend

  ports:
  - protocol: TCP
    # port : port d'écoute du Service à l'intérieur du cluster.
    port: 80
    # targetPort : port du conteneur Nginx (containerPort du Deployment).
    targetPort: 80
    # nodePort : port ouvert sur le nœud, imposé par l'énoncé (30080).
    # Il doit être compris entre 30000 et 32767.
    nodePort: 30080