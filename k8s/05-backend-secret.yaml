# apiVersion : un Secret fait partie du groupe "core", donc "v1".
apiVersion: v1

# kind : stocke des valeurs sensibles (identifiants de connexion à la base).
kind: Secret

metadata:
  # name : nom imposé par l'énoncé, repris dans le Deployment du backend.
  name: backend-secret
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: backend

# type : Opaque = type générique pour des valeurs libres.
type: Opaque

# stringData : valeurs écrites en clair, que Kubernetes encode en base64
# au moment de la création. Attention : le base64 n'est PAS du chiffrement.
stringData:
  # Doit être identique à MYSQL_USER de mysql-secret.
  DB_USER: admin_user
  # Doit être identique à MYSQL_PASSWORD de mysql-secret.
  DB_PASSWORD: admin_pass