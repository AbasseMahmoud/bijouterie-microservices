# apiVersion : la ConfigMap fait partie du groupe "core", donc "v1".
apiVersion: v1

# kind : une ConfigMap stocke de la configuration NON sensible (clé/valeur).
# Les valeurs sensibles (identifiants) sont dans backend-secret.
kind: ConfigMap

metadata:
  # name : nom imposé par l'énoncé, repris dans le Deployment du backend.
  name: backend-config
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: backend

# data : les paires clé/valeur. Toutes les valeurs doivent être des chaînes
# de caractères : les nombres sont donc entre guillemets ("3000"), sinon
# kubectl apply refuse le fichier.
data:
  # Port d'écoute de l'API Node.js (= containerPort du Deployment et
  # targetPort du Service).
  PORT: "3000"
  # Nom du Service MySQL : le DNS interne du cluster le traduit en IP.
  DB_HOST: "mysql"
  # Port du Service MySQL.
  DB_PORT: "3306"
  # Nom de la base : DOIT être identique à MYSQL_DATABASE de mysql-secret.
  DB_NAME: "db_bijouterie"
  # Nom de ta boutique (affiché en en-tête du site).
  SHOP_NAME: "Bijouterie de Mahmoud"
  # Devise affichée pour les prix.
  CURRENCY: "FCFA"
  # Taille maximale d'une photo, en Mo.
  MAX_FILE_SIZE_MB: "5"